<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060607" />
    <!-- iOS reads this only at install time; changing it later requires reinstalling the app. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Rocket Hunter</title>
    <!-- The look chosen in the manager's menu, before the first paint (src/theme.ts does the same), and
         whether the app runs from the Home Screen (src/index.css keeps the screen whole there). -->
    <script>
      if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.dataset.standalone = ''
      }
      try {
        var theme = localStorage.getItem('rocket-hunter.theme')
        var light = theme === 'light' || (theme === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f2f2f5')
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
