# PostgreSQL for local development and tests: docker compose up -d
services:
  postgres:
    image: postgres:18
    ports:
      # Host port 5433 so it does not clash with a Postgres already running on 5432.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: rocket_hunter
      POSTGRES_PASSWORD: rocket_hunter
    volumes:
      - postgres_data:/var/lib/postgresql
    # Lets "docker compose up --wait" (bin/setup) return only when the server accepts
    # TCP connections; on a fresh volume the container is "running" well before that.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rocket_hunter"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
